; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; `config_example.cpp` is a template, not a source file. It sits in `src/`, so without this filter
; PlatformIO compiles it next to your real `src/config.cpp` and the link fails with "multiple
; definition of ingest_url / meter_id / wifi_ssid / …" — every symbol defined twice.
;
; The old README worked around it by telling you to *rename* the example, which left you with no
; template afterwards. Excluding it here means you can copy it instead and keep the reference copy.
build_src_filter = +<*> -<config_example.cpp>

lib_deps =
    ArduinoJson
    TelnetStream
upload_protocol = espota ; espota for esp over the air / esptool for USB
upload_port = esp32-p1-reader.local ; or ESP32 IP address / DNS for OTA
monitor_speed = 9600

