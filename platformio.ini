; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two upload paths, because the first flash cannot use the second.
;
; OTA needs firmware already running on the device to receive the update, so a factory-fresh ESP32 —
; or one whose WiFi credentials are wrong — is only reachable over USB. Keeping both as named
; environments means the first flash is a flag rather than an edit you have to remember to undo:
;
;   pio run -e usb -t upload     first flash, or recovery when OTA stops answering
;   pio run -t upload            everything after that (ota is the default env)
;   pio device monitor           serial log over USB; telnet to the hostname for OTA
[platformio]
default_envs = ota

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; `config_example.cpp` is a template, not a source file. It sits in `src/`, so without this filter
; PlatformIO compiles it next to your real `src/config.cpp` and the link fails with "multiple
; definition of ingest_url / meter_id / wifi_ssid / …" — every symbol defined twice.
;
; The old README worked around it by telling you to *rename* the example, which left you with no
; template afterwards. Excluding it here means you can copy it instead and keep the reference copy.
;
; The trailing `*` is not decoration. Duplicating the file in Finder produces "config_example copy.cpp",
; which an exact-name exclusion sails straight past — so the copy compiled next to the real config and
; every symbol was defined twice again, with a linker error naming a file the README never mentions.
build_src_filter = +<*> -<config_example*>

lib_deps =
    ArduinoJson
    TelnetStream

; Matches `monitorBaudRate` in config.cpp — change both together or the log is mojibake.
monitor_speed = 9600

; Serial.
;
; The port is a glob, not a fixed name and not left to auto-detection. Auto-detection is actively
; wrong on macOS: `/dev/cu.Bluetooth-Incoming-Port` always exists, sorts first, and gets chosen — so
; the upload talks to the Bluetooth stack and dies on "No serial data received" without ever
; addressing the board. A fixed `/dev/cu.usbserial-0001` would work on exactly one machine.
;
; `*usb*` matches every adapter these boards ship with — CP2102 (`cu.usbserial-…`), CH340
; (`cu.wchusbserial…`) and native USB CDC (`cu.usbmodem…`) — while matching neither Bluetooth nor the
; debug console. Run `pio device list` if you need to see what actually enumerated.
[env:usb]
upload_protocol = esptool
upload_port = /dev/cu.*usb*
monitor_port = /dev/cu.*usb*

; Over the air. `upload_port` is the mDNS name set by `hostname` in config.cpp; swap in the device's
; IP address if mDNS is unreliable on your network.
[env:ota]
upload_protocol = espota
upload_port = esp32-p1-reader.local

