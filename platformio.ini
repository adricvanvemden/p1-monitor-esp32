; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two upload paths, because the first flash cannot use the second.
;
; OTA needs firmware already running on the device to receive the update, so a factory-fresh ESP32 —
; or one whose WiFi credentials are wrong — is only reachable over USB. Keeping both as named
; environments means the first flash is a flag rather than an edit you have to remember to undo:
;
;   pio run -e usb -t upload     first flash, or recovery when OTA stops answering
;   pio run -t upload            everything after that (ota is the default env)
;   pio device monitor           serial log over USB; telnet to the hostname for OTA
[platformio]
default_envs = ota

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; `config_example.cpp` is a template, not a source file. It sits in `src/`, so without this filter
; PlatformIO compiles it next to your real `src/config.cpp` and the link fails with "multiple
; definition of ingest_url / meter_id / wifi_ssid / …" — every symbol defined twice.
;
; The old README worked around it by telling you to *rename* the example, which left you with no
; template afterwards. Excluding it here means you can copy it instead and keep the reference copy.
build_src_filter = +<*> -<config_example.cpp>

lib_deps =
    ArduinoJson
    TelnetStream

; Matches `monitorBaudRate` in config.cpp — change both together or the log is mojibake.
monitor_speed = 9600

; Serial. No `upload_port`: PlatformIO auto-detects the board, and hard-coding a /dev/cu.* name is
; the kind of thing that only works on the machine it was written on.
[env:usb]
upload_protocol = esptool

; Over the air. `upload_port` is the mDNS name set by `hostname` in config.cpp; swap in the device's
; IP address if mDNS is unreliable on your network.
[env:ota]
upload_protocol = espota
upload_port = esp32-p1-reader.local

